<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#08081a"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.06" stroke="#a78bfa" stroke-width="0.5">
    <line x1="0" y1="0" x2="0" y2="630"/><line x1="60" y1="0" x2="60" y2="630"/>
    <line x1="120" y1="0" x2="120" y2="630"/><line x1="180" y1="0" x2="180" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/><line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/><line x1="420" y1="0" x2="420" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/><line x1="540" y1="0" x2="540" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/><line x1="660" y1="0" x2="660" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/><line x1="780" y1="0" x2="780" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/><line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/><line x1="1020" y1="0" x2="1020" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/><line x1="1140" y1="0" x2="1140" y2="630"/>
    <line x1="0" y1="0" x2="1200" y2="0"/><line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/><line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/><line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="480" x2="1200" y2="480"/><line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>

  <!-- Glow orbs -->
  <circle cx="200" cy="500" r="200" fill="#7c3aed" opacity="0.08" filter="url(#glow)"/>
  <circle cx="1000" cy="150" r="180" fill="#3b82f6" opacity="0.08" filter="url(#glow)"/>

  <!-- Terminal prompt icon -->
  <text x="100" y="260" font-family="monospace" font-weight="700" font-size="72" fill="url(#grad)" opacity="0.9">&gt;_</text>

  <!-- Title -->
  <text x="100" y="350" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="800" font-size="80" fill="url(#textGrad)">mkt-cli</text>

  <!-- Tagline -->
  <text x="100" y="420" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="400" font-size="32" fill="#94a3b8">Run your ad campaigns from the terminal.</text>

  <!-- Platforms line -->
  <text x="100" y="480" font-family="JetBrains Mono, monospace" font-weight="400" font-size="22" fill="#64748b">Meta  ·  Google Ads  ·  TikTok  ·  LinkedIn</text>

  <!-- Bottom command example -->
  <rect x="80" y="520" width="500" height="52" rx="10" fill="#111127" stroke="#1e1e3a" stroke-width="1"/>
  <text x="100" y="553" font-family="JetBrains Mono, monospace" font-size="18" fill="#a78bfa">$</text>
  <text x="120" y="553" font-family="JetBrains Mono, monospace" font-size="18" fill="#e2e8f0">mkt campaigns list --platform meta</text>

  <!-- URL -->
  <text x="1100" y="600" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="500" font-size="20" fill="#475569" text-anchor="end">mktcli.com</text>
</svg>
